<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RADAR 离线演示 · 腹部 CT 146 项病灶概率</title>
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --border: #e3e8f0;
    --text: #16202e;
    --muted: #6b7a90;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --high: #dc2626;
    --medium: #ea580c;
    --low: #059669;
    --na: #94a3b8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  code { background: #eef2f8; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .app { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
  .app-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .app-header h1 { margin: 0; font-size: 22px; letter-spacing: -0.2px; }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .badge-offline {
    display: inline-flex; align-items: center; gap: 6px;
    background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
    border-radius: 999px; padding: 2px 12px; font-size: 13px; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; margin-top: 20px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
    border-radius: var(--radius); padding: 12px 16px; font-size: 13px; margin-top: 16px; }
  .banner.warn { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
  .banner ul { margin: 8px 0 0; padding-left: 18px; }
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .overview-grid > div { display: flex; flex-direction: column; background: #f8fafc;
    border-radius: 8px; padding: 10px 12px; }
  .overview-grid .label { color: var(--muted); font-size: 12px; }
  .overview-grid .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .top-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
  .top-card { border: 1px solid var(--border); border-left: 4px solid var(--na);
    border-radius: 8px; padding: 12px 14px; }
  .top-card.risk-border-high { border-left-color: var(--high); }
  .top-card.risk-border-medium { border-left-color: var(--medium); }
  .top-card.risk-border-low { border-left-color: var(--low); }
  .top-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .top-organ { font-size: 12px; color: var(--muted); }
  .top-name { font-weight: 600; margin-top: 4px; }
  .top-prob { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .top-english { font-size: 12px; color: var(--muted); word-break: break-word; }
  .risk-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; color: #fff; font-weight: 400; white-space: nowrap; }
  .risk-tag.risk-high, .prob-fill.risk-high { background: var(--high); }
  .risk-tag.risk-medium, .prob-fill.risk-medium { background: var(--medium); }
  .risk-tag.risk-low, .prob-fill.risk-low { background: var(--low); }
  .risk-tag.risk-na, .prob-fill.risk-na { background: var(--na); }
  .result-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .filters select, .filters input[type="search"] {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    font-size: 13px; background: #fff; color: var(--text);
  }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .segmented button { border: none; background: #fff; padding: 6px 12px; font-size: 13px;
    cursor: pointer; color: var(--muted); }
  .segmented button.active { background: var(--primary); color: #fff; }
  .threshold-box {
    margin-top: 14px; padding: 14px 16px; background: #fff7ed;
    border: 1px solid #fed7aa; border-radius: 8px;
  }
  .threshold-box input[type="range"] { width: 260px; vertical-align: middle; }
  .threshold-stat { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .organ-group { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  .organ-group h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .organ-group .count { background: #eef2f8; color: var(--muted); border-radius: 999px;
    padding: 0 8px; font-size: 12px; font-weight: 400; }
  .finding-row { display: grid; grid-template-columns: minmax(180px, 1.2fr) minmax(180px, 1.6fr) 140px;
    gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed #eef2f8; }
  @media (max-width: 720px) { .finding-row { grid-template-columns: 1fr; } }
  .finding-row.flagged { background: #fffbeb; border-radius: 6px; }
  .finding-name { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .finding-english { font-size: 12px; color: var(--muted); }
  .prob { display: flex; align-items: center; gap: 10px; }
  .prob-track { flex: 1; height: 8px; background: #eef2f8; border-radius: 999px; overflow: hidden; }
  .prob-fill { height: 100%; border-radius: 999px; }
  .prob-value { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 52px; text-align: right; }
  .risk-text-high { color: var(--high); } .risk-text-medium { color: var(--medium); }
  .risk-text-low { color: var(--low); } .risk-text-na { color: var(--na); }
  .prob-na { font-size: 12.5px; color: var(--muted); }
  .finding-auc { font-size: 12px; color: var(--muted); text-align: right; }
  .sidebar { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; }
  .sidebar h2 { margin: 0 0 10px; font-size: 14px; }
  .sidebar section { margin-bottom: 18px; }
  .sidebar ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .sidebar li { margin-bottom: 6px; }
  .sidebar strong { color: var(--text); }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px;
    border-bottom: 1px dashed #eef2f8; font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--muted); }
  .app-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div>
      <h1>RADAR · 腹部 CT 智能分析 <span class="muted" style="font-size:14px;">（离线演示）</span></h1>
      <p class="subtitle">
        基于通用视觉-语言模型，输出 <strong>146 项</strong>「器官-病灶」阳性概率
      </p>
    </div>
    <div class="badge-offline"><span class="dot"></span>离线演示 · 数据为真实推理结果</div>
  </header>

  <div class="banner">
    本页数据来自仓库内 <code>results/RADAR_infer_results_demo.csv</code>，
    是官方 demo 病例 <code>AC423ccbe.nii.gz</code> 的<strong>真实模型输出</strong>（非模拟数据）。
    页面不依赖后端、GPU 与网络，可直接分享给临床同事查看。
  </div>

  <main class="layout">
    <div class="content">
      <section class="panel" id="overview"></section>

      <section class="panel">
        <h2>概率最高的 10 项</h2>
        <p class="muted">
          下表中的数值是模型判断该病灶存在的<strong>阳性概率</strong>，不是准确率。
        </p>
        <div class="top-grid" id="top"></div>
      </section>

      <section class="panel">
        <div class="result-head">
          <h2>全部病灶标签</h2>
        </div>

        <div class="threshold-box">
          <label>
            <strong>阈值敏感度体验</strong>：拖动滑块，观察不同判定阈值下有多少标签进入「关注名单」
            <br />
            <input type="range" id="thr" min="0.05" max="0.9" step="0.05" value="0.25" />
            <span class="threshold-stat" id="thrText"></span>
          </label>
          <div class="muted" id="thrDetail"></div>
        </div>

        <div class="filters">
          <select id="organSel"><option value="all">全部器官</option></select>
          <input type="search" id="kw" placeholder="搜索中文/英文名" />
          <div class="segmented" id="riskSeg"></div>
          <div class="segmented" id="sortSeg"></div>
        </div>

        <div id="list"></div>
      </section>
    </div>

    <aside class="sidebar">
      <section>
        <h2>风险分布</h2>
        <div id="riskStat"></div>
      </section>
      <section>
        <h2>阅片时需要知道</h2>
        <ul id="limits"></ul>
      </section>
    </aside>
  </main>

  <footer class="app-footer" id="footer"></footer>
</div>

<script src="demo_data.js"></script>
<script>
(function () {
  var DATA = window.RADAR_DEMO;
  var F = DATA.findings;
  var RISK_TEXT = { high: '高风险', medium: '中风险', low: '低风险', na: '未评估' };

  function pct(v) { return (v * 100).toFixed(1) + '%'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var evaluated = F.filter(function (f) { return f.probability !== null; }).length;
  var counts = { high: 0, medium: 0, low: 0, na: 0 };
  F.forEach(function (f) { counts[f.risk]++; });

  // ---------- 概览 ----------
  document.getElementById('overview').innerHTML =
    '<h2>病例概览</h2><div class="overview-grid">' +
    cell('文件', DATA.case.filename) +
    cell('来源', DATA.case.source) +
    cell('已评估标签', evaluated + ' / ' + F.length) +
    cell('高风险(≥0.5)', String(counts.high)) +
    cell('中风险(0.25~0.5)', String(counts.medium)) +
    cell('低风险(<0.25)', String(counts.low)) +
    '</div><p class="muted" style="margin:12px 0 0;">' + esc(DATA.case.note) +
    '；数据文件 <code>' + esc(DATA.case.csv) + '</code></p>';

  function cell(label, value) {
    return '<div><span class="label">' + label + '</span><span class="value">' + esc(value) + '</span></div>';
  }

  // ---------- Top 10 ----------
  var top = F.filter(function (f) { return f.probability !== null; })
    .sort(function (a, b) { return b.probability - a.probability; }).slice(0, 10);
  document.getElementById('top').innerHTML = top.map(function (f) {
    return '<div class="top-card risk-border-' + f.risk + '">' +
      '<div class="top-card-head"><span class="top-organ">' + esc(f.organ) + '</span>' +
      '<span class="risk-tag risk-' + f.risk + '">' + RISK_TEXT[f.risk] + '</span></div>' +
      '<div class="top-name">' + esc(f.finding) + '</div>' +
      '<div class="top-prob risk-text-' + f.risk + '">' + pct(f.probability) + '</div>' +
      '<div class="top-english">' + esc(f.english) + '</div></div>';
  }).join('');

  // ---------- 侧栏 ----------
  document.getElementById('riskStat').innerHTML =
    kv('高风险 ≥0.5', counts.high) + kv('中风险 0.25~0.5', counts.medium) +
    kv('低风险 <0.25', counts.low) + kv('未评估(未检出器官)', counts.na) +
    kv('合计', F.length);

  function kv(k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; }

  document.getElementById('limits').innerHTML = [
    '<li><strong>无位置信息</strong>：只输出标签概率，不告知病灶在器官的哪一段，需自行回片核实。</li>',
    '<li><strong>无定量指标</strong>：没有径线、CT 值、强化程度，无法直接写入报告正文。</li>',
    '<li><strong>阈值未标定</strong>：0.5 / 0.25 仅为展示分级，' + esc(DATA.risk_note) + '</li>',
    '<li><strong>灰区很宽</strong>：本例有 <strong>' +
      F.filter(function (f) { return f.probability >= 0.1 && f.probability < 0.5; }).length +
      '</strong> 项落在 0.1~0.5，临床难以取舍。</li>',
    '<li><strong>罕见病易假阳性</strong>：如「肾上腺_脂肪瘤」一类低患病率标签，中等概率多为误报。</li>'
  ].join('');

  document.getElementById('footer').textContent = DATA.disclaimer + ' ' +
    '参考 AUC：' + DATA.reference_auc_note;

  // ---------- 筛选器 ----------
  var organs = [];
  F.forEach(function (f) { if (organs.indexOf(f.organ) < 0) organs.push(f.organ); });
  organs.forEach(function (o) {
    var n = F.filter(function (f) { return f.organ === o; }).length;
    var opt = document.createElement('option');
    opt.value = o; opt.textContent = o + '（' + n + '）';
    document.getElementById('organSel').appendChild(opt);
  });

  var filter = 'all', sortMode = 'prob', threshold = 0.25;
  var RISK_OPTS = [['all', '全部'], ['high', '高风险'], ['medium', '中风险'], ['evaluated', '已评估']];
  var SORT_OPTS = [['prob', '概率降序'], ['organ', '按标签顺序']];

  buildSeg(document.getElementById('riskSeg'), RISK_OPTS, filter, function (v) {
    filter = v; render();
  });
  buildSeg(document.getElementById('sortSeg'), SORT_OPTS, sortMode, function (v) {
    sortMode = v; render();
  });

  function buildSeg(host, opts, current, onPick) {
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.textContent = o[1];
      b.className = o[0] === current ? 'active' : '';
      b.onclick = function () {
        Array.prototype.forEach.call(host.children, function (c) { c.className = ''; });
        b.className = 'active';
        onPick(o[0]);
      };
      host.appendChild(b);
    });
  }

  // ---------- 阈值交互 ----------
  var thr = document.getElementById('thr');
  thr.oninput = function () {
    threshold = parseFloat(thr.value);
    render();
  };

  var withAucNames = F.filter(function (f) { return f.reference_auc; }).length;

  document.getElementById('organSel').onchange = render;
  document.getElementById('kw').oninput = render;

  function render() {
    var organ = document.getElementById('organSel').value;
    var kw = document.getElementById('kw').value.trim().toLowerCase();

    var hits = F.filter(function (f) {
      return f.probability !== null && f.probability >= threshold;
    });
    document.getElementById('thrText').textContent =
      '阈值 ' + threshold.toFixed(2) + ' → 关注 ' + hits.length + ' 项';
    document.getElementById('thrDetail').textContent =
      '占全部 ' + F.length + ' 个标签的 ' + (hits.length / F.length * 100).toFixed(1) +
      '%。阈值调低到 0.10 时会膨胀到 ' +
      F.filter(function (f) { return f.probability !== null && f.probability >= 0.1; }).length +
      ' 项——这正是上线前必须自行标定的原因。';

    var rows = F.filter(function (f) {
      if (filter === 'high' && f.risk !== 'high') return false;
      if (filter === 'medium' && f.risk !== 'medium') return false;
      if (filter === 'evaluated' && f.probability === null) return false;
      if (organ !== 'all' && f.organ !== organ) return false;
      if (kw &&
          f.finding.toLowerCase().indexOf(kw) < 0 &&
          f.english.toLowerCase().indexOf(kw) < 0 &&
          f.organ.indexOf(kw) < 0) return false;
      return true;
    });

    var groups = [];
    var seen = {};
    rows.forEach(function (f) {
      if (!seen[f.organ]) { seen[f.organ] = []; groups.push(f.organ); }
      seen[f.organ].push(f);
    });

    if (sortMode === 'prob') {
      Object.keys(seen).forEach(function (o) {
        seen[o].sort(function (a, b) {
          return (b.probability === null ? -1 : b.probability) -
                 (a.probability === null ? -1 : a.probability);
        });
      });
      groups.sort(function (a, b) {
        return maxP(b) - maxP(a);
      });
      function maxP(o) {
        var m = 0;
        seen[o].forEach(function (f) { if (f.probability !== null && f.probability > m) m = f.probability; });
        return m;
      }
    }

    var html = groups.map(function (o) {
      return '<div class="organ-group"><h3>' + esc(o) +
        '<span class="count">' + seen[o].length + '</span></h3>' +
        seen[o].map(row).join('') + '</div>';
    }).join('');

    document.getElementById('list').innerHTML =
      html || '<p class="muted">没有符合筛选条件的标签。</p>';
  }

  function row(f) {
    var flagged = f.probability !== null && f.probability >= threshold;
    var bar = f.probability === null
      ? '<span class="prob-na">该器官在本次扫描中未检出，未参与评估</span>'
      : '<div class="prob"><div class="prob-track"><div class="prob-fill risk-' + f.risk +
        '" style="width:' + Math.max(f.probability * 100, 1.5) + '%"></div></div>' +
        '<span class="prob-value risk-text-' + f.risk + '">' + pct(f.probability) + '</span></div>';
    var auc = f.reference_auc
      ? '<span title="外部验证集 ROC-AUC，非单例准确率">参考 AUC ' + f.reference_auc.toFixed(3) + '</span>'
      : '<span class="muted">—</span>';
    return '<div class="finding-row' + (flagged ? ' flagged' : '') + '">' +
      '<div class="finding-main"><div class="finding-name">' + esc(f.finding) +
      '<span class="risk-tag risk-' + f.risk + '">' + RISK_TEXT[f.risk] + '</span></div>' +
      '<div class="finding-english">' + esc(f.english) + '</div></div>' +
      bar + '<div class="finding-auc">' + auc + '</div></div>';
  }

  render();
})();
</script>
</body>
</html>
