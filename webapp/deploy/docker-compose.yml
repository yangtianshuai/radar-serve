services:
  radarserve:
    build:
      context: ../..
      dockerfile: webapp/deploy/Dockerfile
    image: radarserve:latest
    container_name: radarserve
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 模型权重（HuggingFace 下载到 DAMO-RADAR/ckpt），只读挂载
      - ../../DAMO-RADAR/ckpt:/ckpt:ro
      - radarserve-data:/data
    environment:
      MODEL_ROOT: /ckpt
      CONFIGS_ROOT: /ckpt
      RADAR_DATA_DIR: /data
      RADAR_DEVICE: cuda
      RADAR_MAX_UPLOAD_MB: "2048"
    # GPU 直通。注意：旧版 docker compose 会**静默忽略**下面这段，
    # 症状是容器里看不到 GPU、推理退化到 CPU，却没有任何报错。
    # deploy.sh 在启动后会 docker exec nvidia-smi 验证一次。
    # 若你的 compose 较旧（< v2.30），可把这段换成一行 `gpus: all`。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  radarserve-data:
